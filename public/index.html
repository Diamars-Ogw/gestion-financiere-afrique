<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#075B3D" />
    <meta name="description" content="Mon Budget : suis tes revenus, dépenses, budgets et objectifs depuis ton téléphone." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mon Budget" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <title>Mon Budget</title>
    <style>
      html, body, #root { width: 100%; height: 100%; margin: 0; }
      #root { display: flex; flex: 1; }
      body { overscroll-behavior: none; }
    </style>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function (error) {
            console.error("Service worker registration failed:", error);
          });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
