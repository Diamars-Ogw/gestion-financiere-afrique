name: Appliquer la refonte
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Décompresser et copier
        run: |
          mkdir /tmp/new
          unzip -q mon-budget-refonte-complete.zip -d /tmp/new
          rsync -a --exclude='.github' /tmp/new/gestion-financiere-afrique-main/ ./
      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Rien à changer" || (git commit -m "Refonte visuelle complète (thèmes clair et sombre)" && git push)
