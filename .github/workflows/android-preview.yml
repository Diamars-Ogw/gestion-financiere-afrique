name: Android debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1
      - run: npm install
      - run: npx expo prebuild --platform android --no-install --clean
        env:
          CI: "1"
      - name: Build installable debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: mon-equilibre-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
